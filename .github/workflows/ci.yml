name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # The release runs these checks again on its tag
  workflow_call:
  # The PPA's Wireshark moves on by itself: notice when it breaks something
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install Wireshark (sharkd, dumpcap, editcap, mergecap) from the stable PPA
        shell: bash
        run: |
          # Launchpad is unreachable now and then: retry up to 5 times, pausing 15, 30, 60, 120 s
          retry() {
            local attempt pause=15
            for attempt in 1 2 3 4 5; do
              if "$@"; then
                return 0
              fi
              if [ "$attempt" -eq 5 ]; then
                echo "::error::'$*' failed after $attempt attempts" >&2
                return 1
              fi
              echo "Attempt $attempt of '$*' failed, retrying in ${pause}s" >&2
              sleep "$pause"
              pause=$((pause * 2))
            done
          }
          install_wireshark() {
            sudo apt-get update &&
              sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends wireshark-common
          }
          retry sudo add-apt-repository -y ppa:wireshark-dev/stable
          echo "wireshark-common wireshark-common/install-setuid boolean false" | sudo debconf-set-selections
          retry install_wireshark
          # let the runner user capture on loopback for the capture tests
          sudo setcap cap_net_raw,cap_net_admin=eip /usr/bin/dumpcap
          sharkd --version | head -1

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: npm run test:examples
      - run: npm run test:package
      # The runner's Chrome; without one these fail here instead of skipping
      - run: npm run test:browser
      - run: npm run test:live
