name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # The PPA's Wireshark moves on by itself: notice when it breaks something
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install Wireshark (sharkd, dumpcap, editcap, mergecap) from the stable PPA
        shell: bash
        run: |
          sudo add-apt-repository -y ppa:wireshark-dev/stable
          sudo apt-get update
          echo "wireshark-common wireshark-common/install-setuid boolean false" | sudo debconf-set-selections
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends wireshark-common
          # let the runner user capture on loopback for the capture tests
          sudo setcap cap_net_raw,cap_net_admin=eip /usr/bin/dumpcap
          sharkd --version | head -1

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: npm run test:live
