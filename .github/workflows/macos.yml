# A probe, started by hand: shows what works on macOS, which we can't try locally.
# Not a gate. It never runs on push or pull requests, so it can't affect their status.
name: macOS (experimental)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install Wireshark's command-line tools
        run: brew install wireshark

      # Never fails: the output says which tools the formula ships
      - name: Which Wireshark tools are on PATH
        shell: bash
        run: |
          for tool in sharkd dumpcap editcap mergecap capinfos; do
            if path=$(command -v "$tool"); then
              echo "$tool: $path"
              "$tool" --version 2>&1 | head -1 || true
            else
              echo "$tool: MISSING"
            fi
          done
          echo "--- sharkd Lua support"
          if command -v sharkd >/dev/null; then
            sharkd --version 2>&1 | grep -i lua || echo "sharkd reports no Lua"
          fi
          true

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

      # Capturing reads /dev/bpf*, which are root-only by default. The hosted runner is a throwaway VM, so
      # they are opened to everyone. macOS makes the next device only when the last one is opened (by root
      # alone), and dumpcap -S opens every interface at once, so it could open only as many as exist: the
      # devices are forced into existence first, the way Wireshark's ChmodBPF does (reading zero bytes opens
      # each one). macOS may still add devices while captures run (libpcap takes the first free one), so a
      # loop keeps the mode on those too until the job ends; the first chmod is done in the foreground, so
      # the checks below start with it in place. Wireshark's ChmodBPF needs a group the running shell
      # wouldn't have joined yet.
      - name: Give the job's user access to the BPF devices
        shell: bash
        run: |
          echo "bpf devices before: $(ls /dev/bpf* 2>/dev/null | wc -l | tr -d ' ')"
          sudo bash -c 'for N in $(seq 0 127); do { read -n 0 < /dev/bpf$N; } 2>/dev/null || true; done; chmod o+rw /dev/bpf*'
          sudo nohup bash -c 'while :; do chmod o+rw /dev/bpf* 2>/dev/null; sleep 1; done' >/dev/null 2>&1 &
          disown
          echo "bpf devices after: $(ls /dev/bpf* | wc -l | tr -d ' ')"
          ls -l /dev/bpf0

      # Never fails: what the live checks use on this machine
      - name: What the live checks rely on
        shell: bash
        run: |
          echo "--- ping as the runner user"
          id -un
          ping -i 0.2 -c 2 127.0.0.1 || echo "ping -i 0.2: exit $?"
          ping -i 0.005 -c 2 127.0.0.1 || echo "ping -i 0.005: exit $?"
          echo "--- what a capture start prepares (the app's dumpcap -D -M, then the filter check)"
          time dumpcap -D -M >/dev/null || true
          time dumpcap -i lo0 -f icmp -d >/dev/null || true
          echo "--- tools"
          /usr/bin/curl --version | head -1 || true
          command -v curl || true
          python3 --version || true
          openssl version || true
          pgrep -V 2>&1 | head -1 || true
          command -v pgrep lsof ps || true
          echo "--- boot session"
          sysctl -n kern.bootsessionuuid || echo "kern.bootsessionuuid: exit $?"
          echo "--- ps rss of this shell (KiB)"
          ps -o rss= -p $$ || true
          true

      # Fails when capturing on the loopback doesn't work: the live steps below can't mean anything then
      - name: Capture on the loopback
        shell: bash
        run: |
          set -euo pipefail
          dumpcap -D | tee "$RUNNER_TEMP/interfaces.txt"
          grep -Eq '^[0-9]+\. lo0( |$)' "$RUNNER_TEMP/interfaces.txt" || { echo "dumpcap -D doesn't list lo0"; exit 1; }
          dumpcap -L -i lo0 | tee "$RUNNER_TEMP/linktypes.txt"
          grep -q "Data link types" "$RUNNER_TEMP/linktypes.txt" || { echo "dumpcap -L -i lo0 printed no link types"; exit 1; }
          rm -f "$RUNNER_TEMP/probe.pcapng"
          dumpcap -q -i lo0 -a duration:1 -w "$RUNNER_TEMP/probe.pcapng"
          capinfos "$RUNNER_TEMP/probe.pcapng"
          # Counted, not checked: whether each ping packet is seen once or twice on lo0
          rm -f "$RUNNER_TEMP/ping.pcapng"
          dumpcap -q -i lo0 -f icmp -a duration:4 -w "$RUNNER_TEMP/ping.pcapng" &
          capture=$!
          sleep 1.5
          ping -c 3 127.0.0.1
          wait "$capture"
          echo "packets captured during 3 pings (6 if each is seen once): $(capinfos -c -M "$RUNNER_TEMP/ping.pcapng" | awk '/Number of packets/ {print $NF}')"
          echo "bpf devices now: $(ls /dev/bpf* | wc -l | tr -d ' ')"

      # Never fails: what the extension trust checks read here, to compare with the samples in
      # test/units.mjs, and what they make of the folders extensions and their copies live in
      - name: What the extension trust checks read
        shell: bash
        run: |
          for p in / /Users "$HOME" "$HOME/.local" "$HOME/.local/share" /private /private/tmp /private/var/folders "$TMPDIR" /opt/homebrew /usr/local; do
            if [ -e "$p" ]; then /bin/ls -ledq -- "$p" || true; fi
          done
          echo "--- mount"
          /sbin/mount || true
          echo "--- devices"
          stat -f "%d %N" / /System/Volumes/Data /Users "$HOME" "$TMPDIR" /private/tmp || true
          echo "--- verdicts"
          npx esbuild src/server/trust.ts --bundle --platform=node --format=esm --outfile="$RUNNER_TEMP/trust.mjs" --log-level=warning || true
          mkdir -p "$HOME/.local/share/wirebuddy/extensions" || true
          node --input-type=module -e '
            const { rootTrust } = await import(process.argv[1]);
            for (const p of process.argv.slice(2)) console.log(p, "->", JSON.stringify(rootTrust(p)));
          ' "$RUNNER_TEMP/trust.mjs" "$HOME/.local/share/wirebuddy/extensions" "$HOME" "$TMPDIR" /tmp /Users || true
          true

      # npm test is an && chain that stops at the first failure; run its files
      # one by one so every result shows (build is done above)
      - name: test/units.mjs
        if: ${{ !cancelled() }}
        run: node test/units.mjs
      - name: test/framestore.mjs
        if: ${{ !cancelled() }}
        run: node test/framestore.mjs
      - name: test/slices.mjs
        if: ${{ !cancelled() }}
        run: node test/slices.mjs
      - name: test/api-smoke.mjs
        if: ${{ !cancelled() }}
        run: node test/api-smoke.mjs
      - name: test/mcp-smoke.mjs
        if: ${{ !cancelled() }}
        run: node test/mcp-smoke.mjs
      - name: test/panels-smoke.mjs
        if: ${{ !cancelled() }}
        run: node test/panels-smoke.mjs
      - name: test/sharkd.mjs
        if: ${{ !cancelled() }}
        run: node test/sharkd.mjs

      - name: npm run test:examples
        if: ${{ !cancelled() }}
        run: npm run test:examples
      - name: npm run test:package
        if: ${{ !cancelled() }}
        run: npm run test:package
      # The runner's Chrome; without one these fail here instead of skipping
      - name: test/browser.mjs
        if: ${{ !cancelled() }}
        env:
          CHROME: "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome"
        run: node test/browser.mjs
      - name: test/browser-control.mjs
        if: ${{ !cancelled() }}
        env:
          CHROME: "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome"
        run: node test/browser-control.mjs

      # npm run test:live is the same three files; here each one reports on its own
      - name: test/live-smoke.mjs
        if: ${{ !cancelled() }}
        run: node test/live-smoke.mjs
      - name: test/live-tail.mjs
        if: ${{ !cancelled() }}
        env:
          CHROME: "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome"
        run: node test/live-tail.mjs
      - name: test/live-follow.mjs
        if: ${{ !cancelled() }}
        env:
          CHROME: "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome"
        run: node test/live-follow.mjs
