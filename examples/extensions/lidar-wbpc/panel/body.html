<div class="view"></div>
<div class="hud">
  <div class="bar">
    <button class="prev" type="button" title="Previous scan (←)">◀</button>
    <button class="play" type="button" title="Play or pause (Space)">Play</button>
    <button class="next" type="button" title="Next scan (→)">▶</button>
    <button class="goto" type="button" title="Select this scan's first packet in WireBuddy">Packet</button>
    <input class="scrub" type="range" min="0" max="0" value="0" title="Scan">
    <select class="color" title="Color by">
      <option value="0">Intensity</option>
      <option value="1">Height</option>
      <option value="2">Ring</option>
    </select>
  </div>
  <div class="scan"></div>
  <div class="hint">Drag to orbit · Shift+drag to pan · wheel to zoom · double-click to reset</div>
</div>
